<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Доска курса — Nexus Learn</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="board-page">

<!-- Top bar -->
<header class="board-topbar">
  <a href="courses.html" class="back-btn">← Назад</a>
  <span class="course-title" id="courseTitle">Загрузка…</span>
  <div class="ws-status" id="wsStatus" title="WebSocket"></div>

  <!-- Tutor-only -->
  <button class="btn btn-outline-secondary btn-sm d-none" id="btnPublish">Опубликовать</button>
  <button class="btn btn-outline-secondary btn-sm d-none" id="btnAddElement">+ Элемент</button>
  <button class="btn btn-outline-secondary btn-sm d-none" id="btnLinkMode">Связать</button>
  <button class="btn btn-outline-secondary btn-sm d-none" id="btnDeleteConnections">Очистить связи</button>
</header>

<!-- Toolbar: filters + zoom -->
<div class="board-toolbar">
  <div class="filter-group">
    <span class="filter-label">Фильтр:</span>
    <div class="form-check form-check-inline mb-0">
      <input class="form-check-input" type="checkbox" id="filterUnviewed" />
      <label class="form-check-label" for="filterUnviewed" style="font-size:13px;color:var(--text-mid)">
        Непросмотренные
      </label>
    </div>
    <div class="filter-date-wrap">
      <input type="date" id="filterDateFrom" title="Обновлено с" />
      <span style="color:var(--text-lo);font-size:12px">—</span>
      <input type="date" id="filterDateTo" title="Обновлено по" />
    </div>
    <button class="btn btn-outline-secondary btn-sm" id="btnResetFilters">Сбросить</button>
  </div>

  <div class="toolbar-sep"></div>

  <div class="zoom-group">
    <span class="filter-label">Зум</span>
    <input type="range" id="zoomSlider" min="20" max="200" value="100" />
    <span class="zoom-label" id="zoomPercent">100%</span>
  </div>
</div>

<!-- Board -->
<div class="board-container" id="boardContainer">
  <div class="board-stage" id="boardStage">
    <svg id="boardConnections" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="boardElements"></div>
  </div>

  <!-- Mini-map -->
  <div class="board-minimap" id="boardMinimap">
    <span class="minimap-label">overview</span>
    <canvas id="minimapCanvas"></canvas>
    <div class="minimap-viewport" id="minimapViewport"></div>
  </div>
</div>

<!-- ─── Modal: view / edit element ─────────────────────── -->
<div class="modal fade" id="modalElement" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalElementTitle">Элемент</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modalElementBody"></div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Закрыть</button>
        <button class="btn btn-danger btn-sm d-none" id="btnDeleteElement">Удалить</button>
        <button class="btn btn-primary btn-sm d-none" id="btnSaveElement">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── Modal: new element ──────────────────────────────── -->
<div class="modal fade" id="modalNewElement" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Новый элемент</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Название *</label>
          <input type="text" class="form-control" id="newElTitle" placeholder="Тема урока" />
        </div>
        <div class="mb-2">
          <label class="form-label">Ссылка на контент</label>
          <input type="url" class="form-control" id="newElContentUrl" placeholder="https://…" />
        </div>
        <div class="mb-2">
          <label class="form-label">Ссылка на файл</label>
          <input type="url" class="form-control" id="newElFileUrl" placeholder="https://…" />
        </div>
        <div class="mb-2">
          <label class="form-label">Комментарий тьютора</label>
          <input type="text" class="form-control" id="newElComment" />
        </div>
        <div class="row mb-2">
          <div class="col-6">
            <label class="form-label">X</label>
            <input type="number" class="form-control" id="newElX" value="100" />
          </div>
          <div class="col-6">
            <label class="form-label">Y</label>
            <input type="number" class="form-control" id="newElY" value="100" />
          </div>
        </div>
        <div class="row mb-2">
          <div class="col-6">
            <label class="form-label">Фон</label>
            <input type="color" class="form-control form-control-color" id="newElBg" value="#ffffff" />
          </div>
          <div class="col-6">
            <label class="form-label">Граница</label>
            <input type="color" class="form-control form-control-color" id="newElBorder" value="#333333" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary btn-sm" id="btnCreateElement">Создать</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/board.js"></script>
</body>
</html>
