<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мои курсы — Nexus Learn</title>
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%237b6ef6'/%3E%3Cstop offset='100%25' style='stop-color:%233ecf8e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<body>

<!-- Navbar -->
<nav class="app-navbar">
  <a href="courses.html" class="nav-logo">
    <div class="dot"></div>
    Nexus Learn
  </a>
  <div class="nav-spacer"></div>
  <span class="nav-user" id="navUser"></span>
  <button class="btn btn-outline-secondary btn-sm" id="btnLogout">Выйти</button>
</nav>

<!-- Main -->
<main class="courses-page">
  <div class="courses-header">
    <div>
      <h1>Мои <span>курсы</span></h1>
      <p class="sub" id="coursesCount"></p>
    </div>

    <div class="courses-search">
      <input type="search" id="coursesSearch" class="form-control" placeholder="Поиск по курсам..." />
    </div>

    <div id="tutorActions" class="d-none">
      <button class="btn btn-primary btn-sm" id="btnNewCourse">
        + Новый курс
      </button>
    </div>
  </div>

  <div id="coursesGrid" class="courses-grid">
    <!-- cards injected by JS -->
  </div>

  <div id="emptyState" class="empty-state d-none">
    <div class="icon">📚</div>
    <h3>Курсов пока нет</h3>
    <p>Когда преподаватель добавит курс — он появится здесь</p>
  </div>

  <div id="loadingState" class="empty-state">
    <div class="spinner"></div>
  </div>
</main>

<!-- Modal: new course (tutor only) -->
<div class="modal fade" id="modalNewCourse" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Новый курс</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Название курса</label>
          <input type="text" class="form-control" id="newCourseTitle" placeholder="Введите название" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary btn-sm" id="btnCreateCourse">Создать</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: edit course title (tutor only) -->
<div class="modal fade" id="modalEditCourse" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Редактировать курс</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Название курса</label>
          <input type="text" class="form-control" id="editCourseTitle" placeholder="Введите название" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary btn-sm" id="btnSaveCourseTitle">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script>
(function () {
  if (!isAuthenticated()) { location.href = 'login.html'; return; }

  let currentUser = null;
  let allCourses = [];
  let editingCourseId = null;

  function toast(msg, type = '') {
    const c = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = 'toast-msg' + (type ? ' ' + type : '');
    el.textContent = msg;
    c.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function plural(n, one, few, many) {
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return n + ' ' + one;
    if ([2, 3, 4].includes(mod10) && ![12, 13, 14].includes(mod100)) return n + ' ' + few;
    return n + ' ' + many;
  }

  function renderCourses(courses) {
    const grid = document.getElementById('coursesGrid');
    const empty = document.getElementById('emptyState');
    const loading = document.getElementById('loadingState');
    const count = document.getElementById('coursesCount');

    loading.classList.add('d-none');
    grid.innerHTML = '';

    if (!courses.length) {
      empty.classList.remove('d-none');
      count.textContent = '';
      return;
    }

    count.textContent = courses.length + ' / ' + plural(courses.length, 'курс', 'курса', 'курсов');
    empty.classList.add('d-none');

    courses.forEach(course => {
      const isPublic = course.is_public;
      const isOwner = currentUser && currentUser.id === course.tutor_id;

      const card = document.createElement('div');
      card.className = 'course-card';
      card.style.position = 'relative';

      card.innerHTML = `
        <span class="course-card-badge ${isPublic ? 'badge-public' : 'badge-private'}">
          ${isPublic ? '● Публичный' : '○ Приватный'}
        </span>
        <h3>${escHtml(course.title)}</h3>
        <p>${escHtml(course.description || 'Нет описания')}</p>

        <div style="display:flex;gap:8px;margin-top:12px;">
          <a href="course.html?id=${course.id}" class="btn btn-outline-secondary btn-sm" style="flex:1;text-align:center;">Открыть ↗</a>
          ${isOwner ? `
            <button class="btn btn-outline-secondary btn-sm btn-edit-course" data-id="${course.id}" data-title="${escHtml(course.title)}" title="Редактировать">✎</button>
            <button class="btn btn-outline-danger btn-sm btn-delete-course" data-id="${course.id}" data-title="${escHtml(course.title)}" title="Удалить">✕</button>
          ` : ''}
        </div>
      `;

      grid.appendChild(card);
    });

    // Привязываем обработчики после рендера
    document.querySelectorAll('.btn-delete-course').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const id = parseInt(btn.dataset.id);
        const title = btn.dataset.title;
        if (!confirm(`Удалить курс «${title}»? Это действие необратимо.`)) return;
        try {
          await API.deleteCourse(id);
          toast('Курс удалён');
          // Удаляем из локального массива и перерисовываем
          allCourses = allCourses.filter(c => c.id !== id);
          renderCourses(allCourses);
        } catch (err) {
          toast(err.message || 'Ошибка удаления', 'error');
        }
      });
    });

    document.querySelectorAll('.btn-edit-course').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        editingCourseId = parseInt(btn.dataset.id);
        document.getElementById('editCourseTitle').value = btn.dataset.title;
        new bootstrap.Modal('#modalEditCourse').show();
      });
    });
  }

  function applySearch() {
    const q = document.getElementById('coursesSearch').value.trim().toLowerCase();
    if (!q) {
      renderCourses(allCourses);
      return;
    }

    const filtered = allCourses.filter(course => {
      const text = [
        course.title,
        course.description,
        course.id
      ].join(' ').toLowerCase();
      return text.includes(q);
    });

    renderCourses(filtered);
  }

  async function init() {
    try {
      currentUser = await API.me();
      document.getElementById('navUser').textContent = currentUser.email || '';
    } catch (_) {}

    try {
      allCourses = await API.getCourses();

      const isTutor = allCourses.some(c => c.tutor_id === currentUser?.id);
      if (isTutor || currentUser?.is_tutor) {
        document.getElementById('tutorActions').classList.remove('d-none');
      }

      renderCourses(allCourses);
    } catch (err) {
      if (err.status === 401) {
        clearToken();
        location.href = 'login.html';
      } else {
        toast('Не удалось загрузить курсы', 'error');
      }
      document.getElementById('loadingState').classList.add('d-none');
    }
  }

  document.getElementById('btnLogout').addEventListener('click', () => {
    clearToken();
    location.href = 'login.html';
  });

  document.getElementById('btnNewCourse')?.addEventListener('click', () => {
    document.getElementById('newCourseTitle').value = '';
    new bootstrap.Modal('#modalNewCourse').show();
  });

  document.getElementById('btnCreateCourse').addEventListener('click', async () => {
    const title = document.getElementById('newCourseTitle').value.trim();
    if (!title) return;
    try {
      const course = await API.createCourse({ title });
      bootstrap.Modal.getInstance('#modalNewCourse').hide();
      location.href = 'course.html?id=' + course.id;
    } catch (err) {
      toast(err.message || 'Ошибка создания', 'error');
    }
  });

  // Сохранение редактирования названия курса
  document.getElementById('btnSaveCourseTitle').addEventListener('click', async () => {
    const title = document.getElementById('editCourseTitle').value.trim();
    if (!title || !editingCourseId) return;
    try {
      await API.updateCourse(editingCourseId, { title });
      const course = allCourses.find(c => c.id === editingCourseId);
      if (course) course.title = title;
      bootstrap.Modal.getInstance('#modalEditCourse').hide();
      renderCourses(allCourses);
      toast('Название обновлено', 'success');
    } catch (err) {
      toast(err.message || 'Ошибка', 'error');
    }
  });

  document.getElementById('coursesSearch').addEventListener('input', applySearch);

  init();
})();
</script>
</body>
</html>
